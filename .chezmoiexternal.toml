{{ if eq .chezmoi.os "linux" }}
[".local/bin/tree-sitter"]
  type = "file"
  url = "https://github.com/tree-sitter/tree-sitter/releases/download/v0.24.4/tree-sitter-linux-x64.gz"
  executable = true
  refreshPeriod = "168h"

[".local/bin/lazygit"]
  type = "file"
  url = "https://github.com/jesseduffield/lazygit/releases/download/{{ (gitHubLatestRelease "jesseduffield/lazygit").TagName }}/lazygit_{{ trimPrefix "v" (gitHubLatestRelease "jesseduffield/lazygit").TagName }}_Linux_x86_64.tar.gz"
  executable = true
  refreshPeriod = "168h"
  [".local/bin/lazygit".filter]
    command = "tar"
    args = ["--extract", "--file", "/dev/stdin", "--gzip", "--to-stdout", "lazygit"]

{{ end }}
